<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <header>
        <h1>Feedback Form</h1>
    </header>
    <form>
        <label for="name">Name: </label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required/>
        <br/><br/>
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required/>
        <br/>
        <p>Pleas rate your experience (upto 5): </p>
        <input type="radio" id="1" name="rate" value="1" required/>
        <label for="1">1</label>
        <input type="radio" id="2" name="rate" value="2" required/>
        <label for="2">2</label>
        <input type="radio" id="3" name="rate" value="3" required/>
        <label for="3">3</label>
        <input type="radio" id="4" name="rate" value="4" required/>
        <label for="4">4</label>
        <input type="radio" id="5" name="rate" value="5" required />
        <label for="5">5</label>
        <br/><br/>
        <label for="message">Feedback Message: </label><br/>
        <textarea id="message" name="message" placeholder="Share your feedback..." rows="5" cols="40" maxlength="200" minlength="100" required></textarea>
        <br/><br/>
        <button type="submit">Submit</button>

    </form>
</body>
</html>
