<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <header>
        <h1>Contact Form</h1>
    </header>
    <form>
        <label for="name">Full Name: </label>
        <input type="text" id="name" name="name" placeholder="Enter your fullname" required/>
        <br/><br/>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email write here ! " required>
        <br/><br/>
        <label for="sub">Subject: </label>
        <input type="text" id="sub" name="sub" placeholder="Write here about your subject..." required/>
        <br/><br/>
        <label for="message">Your Message: </label><br/>
        <textarea id="message" name="message" placeholder="Describe..." rows="5" cols="40" maxlength="200"></textarea>
        <br/><br/>
        <button type="submit">Send Message</button>
    </form>
</body>
</html>
